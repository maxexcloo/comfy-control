[env]
_.file = { path = ".env", redact = true }

[tools]
actionlint = "1.7.12"
hadolint = "2.15.1"
prek = "0.4.13"
prettier = "3.9.6"
python = "3.14.7"
ruff = "0.16.2"
uv = "0.12.10"

[tasks.check]
depends = ["test"]
description = "Run all repository checks"
run = "prek run --all-files"

[tasks.cleanup]
description = "Remove caches and bytecode"
run = """
find . -path ./.git -prune -o \
  -type d \\( -name .pytest_cache -o -name .ruff_cache -o -name __pycache__ \\) \
  -prune -exec rm -rf -- {} +
find . -path ./.git -prune -o -type f -name '*.pyc' -exec rm -f -- {} +
"""

[tasks.fmt]
description = "Format all files"
run = """
prettier --write .
ruff check --fix --select I .
ruff format .
"""

[tasks.setup]
description = "Create bootstrap configuration if missing, then install Git hooks"
run = """
if [[ ! -f .env ]]; then
  cp .env.example .env
  echo "Created .env - set the three blank bootstrap secrets before starting"
fi
prek install
"""

[tasks.test]
description = "Run the test suite"
run = "uv run --python python --isolated --no-editable --refresh-package comfy-control --extra test pytest -q"
