name: Prek

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: prek-${{ github.workflow }}-${{ github.ref }}

jobs:
  prek:
    name: Prek
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.1
      - name: Run checks
        run: mise run check
