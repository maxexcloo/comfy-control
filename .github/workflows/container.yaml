name: Container

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: container-${{ github.ref }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4
      - name: Run checks
        run: mise run check

  image:
    name: ${{ matrix.role }} image
    needs: check
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role:
          - control
          - worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - id: metadata
        name: Extract metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.role }}
            type=sha,prefix=sha-,suffix=-${{ matrix.role }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            COMFY_CONTROL_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,scope=${{ matrix.role }},mode=max,ignore-error=true
          context: .
          file: ${{ matrix.role }}/Dockerfile
          labels: ${{ steps.metadata.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          push: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
      - name: Smoke-test runtime
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ matrix.role }}" = worker ]; then
            docker run --rm "${IMAGE_NAME}:worker" sh -c \
              'cd /opt/ComfyUI && python main.py --cpu --quick-test-for-ci --disable-all-custom-nodes'
          else
            docker run --rm "${IMAGE_NAME}:control" python -c 'from control.app import create_app'
          fi
