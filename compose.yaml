name: comfy-control

services:
  comfy-control:
    restart: unless-stopped
    build:
      context: .
      dockerfile: control/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      CONTROL_API_KEY: ${CONTROL_API_KEY:?set CONTROL_API_KEY in .env}
      CONTROL_DATABASE: /data/comfy-control.db
      CONTROL_SECRET_KEY: ${CONTROL_SECRET_KEY:?set CONTROL_SECRET_KEY in .env}
      CONTROL_UI_PASSWORD: ${CONTROL_UI_PASSWORD:?set CONTROL_UI_PASSWORD in .env}
      CONTROL_UI_USERNAME: ${CONTROL_UI_USERNAME:-comfy}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')
    ports:
      - 28081:8000
    volumes:
      - data:/data

volumes:
  data:
